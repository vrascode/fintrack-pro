name: fintrack-pro

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: fintrack
      POSTGRES_DB: fintrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fintrack -d fintrack']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  postgres-test:
    image: postgres:17.11-alpine
    profiles: ['test']
    environment:
      POSTGRES_USER: fintrack_test
      POSTGRES_DB: fintrack_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Set POSTGRES_TEST_PASSWORD in your local .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fintrack_test -d fintrack_test']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
